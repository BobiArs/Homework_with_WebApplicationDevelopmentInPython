<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} — FruitMarket</title>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }

        .card-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0e8345;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .product-emoji {
            font-size: 100px;
            margin-bottom: 16px;
        }

        .product-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #0e8345;
            margin-bottom: 16px;
        }

        .product-rating {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .stars {
            color: #fbbf24;
        }

        .product-id {
            font-size: 11px;
            color: #9ca3af;
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 6px;
            word-break: break-all;
            margin-bottom: 24px;
        }

        .btn-buy {
            width: 100%;
            background: #0e8345;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <a href="{{ url_for('home') }}" class="back-link">⬅ Повернутися до каталогу</a>

        <div class="product-emoji">{{ product.image }}</div>
        <h1 class="product-title">{{ product.title }}</h1>
        <div class="product-price">{{ product.price }} грн / кг</div>
        <div class="product-rating">
            <span class="stars">★★★★★</span> {{ product.rating }} / 5.0
        </div>
        <div class="product-id">UUID: {{ product.id }}</div>
        <button class="btn-buy">🛒 Купити зараз</button>
    </div>
</body>
</html>
