{% extends 'main/layout.html' %}
{% load static %}

{% block content %}
<h2>Реєстрація</h2>

<div id="registerMessage"></div>

<form id="registerForm" style="display: flex; flex-direction: column; gap: 12px; max-width: 350px;">
    {% csrf_token %}

    <input type="text" name="first_name" class="form-ghost" placeholder="Ім'я *" required>
    <input type="text" name="last_name" class="form-ghost" placeholder="Прізвище *" required>

    <div>
        <small>Дата народження:</small><br>
        <input type="date" name="birth_date" class="form-ghost" style="width: 100%;">
    </div>

    <input type="email" name="email" class="form-ghost" placeholder="Email *" required>
    <input type="password" name="password" class="form-ghost" placeholder="Пароль *" required>

    <div>
        <small>Фото профілю (аватар):</small><br>
        <input type="file" name="avatar" accept="image/*" class="form-ghost" style="width: 100%;">
    </div>

    <button type="submit">Зареєструватися</button>
</form>

<script src="{% static 'main/js/register_form.js' %}"></script>
{% endblock %}
