{% extends 'main/layout.html' %}

{% block title %}Додати картку{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-12 col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Створення нової картки</h5>
                <a href="{% url 'index' %}" class="btn btn-sm btn-outline-secondary">Назад</a>
            </div>

            <div class="card-body">
                <form method="POST" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                {% for error in field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ error }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100">Створити картку</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
