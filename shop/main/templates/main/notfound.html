{% extends 'main/layout.html' %}

{% block content %}
<style>
    .not-found-container {
        text-align: center;
        padding: 60px 20px;
    }
    .not-found-title {
        font-size: 6rem;
        font-weight: bold;
        color: #dc3545;
        margin: 0;
    }
    .not-found-text {
        font-size: 1.5rem;
        color: #495057;
        margin-bottom: 20px;
    }
</style>

<div class="not-found-container">
    <h1 class="not-found-title">404</h1>
    <h2 class="not-found-text">Картку не знайдено</h2>
    <p class="text-muted">На жаль, за вашим запитом нічого не вдалося знайти. Спробуйте ввести іншу назву.</p>
    <a href="/" class="btn btn-primary mt-3">На головну</a>
</div>
{% endblock %}
